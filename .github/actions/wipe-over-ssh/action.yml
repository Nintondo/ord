name: Reset Ord index over SSH
description: Gracefully stop Ord and remove only index.redb on its separate /home disk.
inputs:
  host:
    description: SSH host
    required: true
  username:
    description: SSH username
    required: true
  ssh_private_key:
    description: SSH private key
    required: true
  base_path:
    description: Canonical project directory
    required: true
  service_path:
    description: Canonical Ord service directory
    required: true
  compose_project_name:
    description: Existing Compose project name
    required: true
runs:
  using: composite
  steps:
    - name: Reset only the Ord index
      uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
      env:
        BASE_PATH_INPUT: ${{ inputs.base_path }}
        SERVICE_PATH_INPUT: ${{ inputs.service_path }}
        COMPOSE_PROJECT_NAME_INPUT: ${{ inputs.compose_project_name }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.ssh_private_key }}
        envs: BASE_PATH_INPUT,SERVICE_PATH_INPUT,COMPOSE_PROJECT_NAME_INPUT
        script_path: ${{ github.action_path }}/wipe.sh
        command_timeout: 25m
