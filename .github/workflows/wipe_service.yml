name: Wipe service
run-name: "Wipe → ${{ inputs.coin }}-${{ inputs.network }}"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      coin:
        description: Coin
        required: true
        type: choice
        options:
          - bells
      network:
        description: Network
        required: true
        type: choice
        options:
          - mainnet
      confirm_wipe:
        description: 'Type WIPE_MAINNET to confirm'
        required: true
        default: ''

concurrency:
  group: deploy-${{ inputs.coin }}-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  wipe:
    runs-on: self-hosted
    environment: ${{ inputs.coin }}-${{ inputs.network }}

    steps:
      - name: Validate explicit wipe confirmation
        env:
          CONFIRM_WIPE: ${{ inputs.confirm_wipe }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CONFIRM_WIPE" != "WIPE_MAINNET" ]; then
            echo "Wipe requires explicit confirmation."
            echo "Re-run workflow_dispatch and set confirm_wipe=WIPE_MAINNET"
            exit 1
          fi

      - name: Checkout repository for local actions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Wipe service
        uses: ./.github/actions/wipe-over-ssh
        with:
          host: ${{ secrets.HOST_1 }}
          username: ${{ secrets.HOST_1_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          base_path: ${{ vars.BASE_PATH }}
          service_path: ${{ vars.SERVICE_DIR_1 }}
          compose_project_name: ${{ vars.COMPOSE_PROJECT_NAME }}
