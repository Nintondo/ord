name: Deploy service
run-name: >-
  Deploy → ${{
    github.event_name == 'workflow_dispatch'
      && format('{0}-{1}', inputs.coin, inputs.network)
      || format('{0}-{1}', github.event.client_payload.coin, github.event.client_payload.network)
  }} ${{ github.event_name == 'workflow_dispatch' && '(manual)' || '(auto)' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      coin:
        description: Coin
        required: true
        type: choice
        options:
          - bells
      network:
        description: Network
        required: true
        type: choice
        options:
          - mainnet
      sha:
        description: Commit SHA for deploy/rollback (default latest in branch)
        required: false
        default: ''
      confirm_mainnet:
        description: Type DEPLOY_MAINNET to confirm mainnet rollout
        required: false
        default: ''
  repository_dispatch:
    types:
      - deploy
      - Deploy

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.coin, inputs.network) || format('{0}-{1}', github.event.client_payload.coin, github.event.client_payload.network) }}
  cancel-in-progress: false

jobs:
  deployment:
    timeout-minutes: 45
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event.client_payload.coin == 'bells' && github.event.client_payload.network == 'mainnet')
    environment: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.coin, inputs.network) || format('{0}-{1}', github.event.client_payload.coin, github.event.client_payload.network) }}

    steps:
      - name: Block mainnet via repository_dispatch
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.network == 'mainnet'
        shell: bash
        run: |
          set -euo pipefail

          echo "Mainnet deploys must be triggered manually via workflow_dispatch."
          exit 1

      - name: Validate explicit mainnet confirmation
        env:
          CONFIRM_MAINNET: ${{ inputs.confirm_mainnet }}
        if: github.event_name == 'workflow_dispatch' && inputs.network == 'mainnet'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CONFIRM_MAINNET" != "DEPLOY_MAINNET" ]; then
            echo "Mainnet deploy requires explicit confirmation."
            echo "Re-run workflow_dispatch and set confirm_mainnet=DEPLOY_MAINNET"
            exit 1
          fi

      - name: Checkout repository for local actions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve SERVICE_TAG
        uses: ./.github/actions/resolve-service-tag

      - name: Checkout selected deployment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SERVICE_TAG }}

      - name: Validate selected deployment contract
        run: python3 scripts/check_deployment.py

      - name: Log SERVICE_TAG
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying image with SHA ${{ env.SERVICE_TAG }}"

      - name: Log in to Docker Registry
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
          CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$CI_REGISTRY_PASSWORD" \
            | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      - name: Check if image exists
        uses: ./.github/actions/check-image-exists
        with:
          registry: ${{ secrets.CI_REGISTRY }}
          registry_repo: ${{ secrets.CI_REGISTRY_REPO }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_tag: ${{ env.SERVICE_TAG }}

      - name: Render .env from template
        shell: bash
        env:
          ORD_INDEX_SATS: ${{ vars.ORD_INDEX_SATS }}
          ORD_INDEX_RUNES: ${{ vars.ORD_INDEX_RUNES }}
          ORD_INDEX_ADDRESSES: ${{ vars.ORD_INDEX_ADDRESSES }}
          ORD_COMMIT_INTERVAL: ${{ vars.ORD_COMMIT_INTERVAL }}
          ORD_BITCOIN_RPC_USERNAME: ${{ secrets.ORD_BITCOIN_RPC_USERNAME }}
          ORD_BITCOIN_RPC_PASSWORD: ${{ secrets.ORD_BITCOIN_RPC_PASSWORD }}
          ORD_BITCOIN_RPC_URL: ${{ vars.ORD_BITCOIN_RPC_URL }}
          ORD_DATA_DIR: ${{ vars.ORD_DATA_DIR }}
          ORD_INDEX_CACHE_SIZE: ${{ vars.ORD_INDEX_CACHE_SIZE }}
          ORD_IMAGE: ${{ secrets.CI_REGISTRY }}/${{ secrets.CI_REGISTRY_REPO }}/${{ vars.SERVICE_NAME }}:${{ env.SERVICE_TAG }}
        run: |
          set -euo pipefail

          umask 077
          test "$ORD_DATA_DIR" = /app/ord_db
          test -n "$ORD_BITCOIN_RPC_USERNAME"
          test -n "$ORD_BITCOIN_RPC_PASSWORD"
          [[ "$ORD_INDEX_CACHE_SIZE" =~ ^[1-9][0-9]*$ ]]
          envsubst < .env.template > .env.updated
          envsubst '${ORD_IMAGE}' < docker/compose.template.yml > ord.yml.updated

      - name: Copy .env to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOST_1 }}
          username: ${{ secrets.HOST_1_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env.updated,ord.yml.updated,scripts/restart_ord.sh"
          target: "${{ vars.SERVICE_DIR_1 }}"

      - name: Deploy service
        uses: ./.github/actions/deploy-over-ssh
        with:
          host: ${{ secrets.HOST_1 }}
          username: ${{ secrets.HOST_1_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          registry: ${{ secrets.CI_REGISTRY }}
          registry_repo: ${{ secrets.CI_REGISTRY_REPO }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_tag: ${{ env.SERVICE_TAG }}
          docker_compose_file: ${{ vars.DOCKER_COMPOSE_FILE }}
          coin: ${{ vars.COIN }}
          network: ${{ vars.NETWORK }}
          env_updated_file: .env.updated
          base_path: ${{ vars.BASE_PATH }}
          service_path: ${{ vars.SERVICE_DIR_1 }}
          compose_project_name: ${{ vars.COMPOSE_PROJECT_NAME }}
          health_timeout_seconds: "300"
          public_health_url: ${{ vars.PUBLIC_HEALTH_URL }}
          reload_nginx: "false"

      - name: Docker logout
        if: always()
        shell: bash
        env:
          CI_REGISTRY: ${{ secrets.CI_REGISTRY }}
        run: |
          set +e
          docker logout "$CI_REGISTRY"
          exit 0
